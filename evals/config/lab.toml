# The lab the live evaluations run against -- the ONE place its names and addresses
# live. Scenarios never hard-code a container name or an address; they read this.
# Point KRATOS_EVAL_LAB at another file to run against a different lab.

[target]                      # the monitored machine every scenario investigates
host = "10.136.28.168"
user = "ubuntu"
key = "~/.ssh/id_ed25519"     # Kratos's SSH key for the target (also used by setups)
incus = "kratos-target"       # its Incus name, for setups that need the console (C2 stops sshd)

[attacker]                    # where attack traffic comes from -- never the Kratos host
incus = "attacker-box"
ip = "10.136.28.52"

[vulndb]
# The package-vulnerability index (`kratos vulndb-update` builds it) linked into every live
# run's data folder, as a real install has it. Package scenarios (V1_pkg) need it; without
# one they are reported incomplete, not failed. EVAL_VULNDB overrides this path.
path = "~/kratos_eval_artifacts/phaseD3/vulndb.sqlite"

[expect.V1_pkg]
# What the external harness plants for V1_pkg (an old libnghttp2-14 from the 22.04 release
# pocket, inside a snapshot it restores after the run) and what the answer must name.
# EVAL_V1_PKG / EVAL_V1_CVE override them.
package = "nghttp2"
cve = "CVE-2023-44487"

[fleet]
# The group a fleet scenario (D2_fleet) asks about, in key or certificate mode as the lab is.
machines = ["10.136.28.168", "10.136.28.108", "10.136.28.149"]

[expect.D2_fleet]
# The external harness plants this account on ONE machine of the group (in its sudo/wheel group)
# and removes it after the run. The answer must name it for that machine and no other.
machine = "10.136.28.149"
account = "evalfleet"

[recordings]
# Recordings may hold only lab data. tests/test_eval_recordings.py fails on any address
# outside private, loopback, link-local and documentation ranges unless it is listed
# here with the reason, and on anything shaped like a key or token.
allowed_public_addresses = {}
