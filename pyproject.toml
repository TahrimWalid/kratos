[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[project]
name = "kratos-security-assistant"
version = "0.1.0"
description = "Kratos — a self-hostable, self-growing security assistant"
readme = "README.md"
requires-python = ">=3.10"
# Kratos itself is MIT; the starter YARA rules shipped as package data are
# GPL-2.0 (Yara-Rules project), with their licence text alongside them.
license = "MIT AND GPL-2.0-only"
license-files = ["LICENSE", "src/kratos/yara_rules/LICENSE"]
authors = [{ name = "Tahrim Walid" }]
keywords = ["security", "intrusion detection", "incident response", "linux", "llm", "agent", "ssh", "yara", "nmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests",
    "python-dotenv",
    "rich>=13",
    "prompt_toolkit",
    # Upper bounds on the two libraries whose majors break Kratos: mcp 2.x renamed
    # FastMCP (kratos mcp-serve failed to import on a fresh install), and Textual
    # changes its API between majors. Raise each after testing on the new major.
    "textual>=8.2,<9",
    "mcp>=1.10,<2",
    # IANA tz database for zoneinfo on hosts without /usr/share/zoneinfo (containers,
    # Windows) -- time-window resolution must never silently fall back to UTC.
    "tzdata",
    # Presets, schedules and triggers are TOML; tomllib is stdlib from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/TahrimWalid/kratos"
Documentation = "https://github.com/TahrimWalid/kratos/blob/main/docs/GUIDE.md"
Repository = "https://github.com/TahrimWalid/kratos"
Issues = "https://github.com/TahrimWalid/kratos/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
# Bare `kratos` launches the full-screen Textual TUI (the primary interface);
# `kratos <subcommand>` (investigate / run / chat / scan / mcp-serve / llm-serve
# / findings-* / ...) dispatches through cli/app.py as before. The classic
# prompt_toolkit REPL is retired as the default face -- its code stays in the
# tree, but there is no longer a bare-command or script entry that launches it.
kratos = "kratos.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that must ship in the wheel: the starter YARA rules (third-
# party, GPLv2 -- their README carries the source, LICENSE the full text) are
# read by run_yara_scan and bundled into every sub-agent installer; the settings
# template is what `kratos init` writes.
[tool.setuptools.package-data]
kratos = ["yara_rules/*.yar", "yara_rules/README.md", "yara_rules/LICENSE", "templates/env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agent_llm: hits a real LLM backend and the real (not mocked) agent loop -- expensive (roughly 1-2 min/scenario on Gemini, 10-20 min/scenario on local qwen2.5:7b). Excluded from a bare `pytest` run; opt in with -m agent_llm.",
]
addopts = "-m 'not agent_llm'"

