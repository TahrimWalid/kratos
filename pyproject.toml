[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[project]
name = "kratos-security-assistant"
version = "0.1.0"
description = "Kratos — a self-hostable, self-growing security assistant"
readme = "README.md"
requires-python = ">=3.10"
# Kratos itself is MIT; the starter YARA rules shipped as package data are
# GPL-2.0 (Yara-Rules project), with their licence text alongside them.
license = "MIT AND GPL-2.0-only"
license-files = ["LICENSE", "src/kratos/yara_rules/LICENSE"]
authors = [{ name = "Tahrim Walid" }]
keywords = ["security", "intrusion detection", "incident response", "linux", "llm", "agent", "ssh", "yara", "nmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests",
    "python-dotenv",
    "rich>=13",
    "prompt_toolkit",
    # Upper bounds on the two libraries whose majors break Kratos: mcp 2.x renamed
    # FastMCP (kratos mcp-serve failed to import on a fresh install), and Textual
    # changes its API between majors. Raise each after testing on the new major.
    "textual>=8.2,<9",
    "mcp>=1.10,<2",
    # IANA tz database for zoneinfo on hosts without /usr/share/zoneinfo (containers,
    # Windows) -- time-window resolution must never silently fall back to UTC.
    "tzdata",
    # Presets, schedules and triggers are TOML; tomllib is stdlib from 3.11.
    "tomli>=1.1; python_version < '3.11'",
    # Package-vulnerability matching (A.2): Debian, RPM and Alpine version comparison,
    # the same library VulnerableCode uses. Pinned: comparison rules must not shift
    # under a released index. Apache-2.0; pulls attrs, packaging, semantic-version, semver.
    "univers==32.0.1",
]

[project.urls]
Homepage = "https://github.com/TahrimWalid/kratos"
Documentation = "https://github.com/TahrimWalid/kratos/blob/main/docs/GUIDE.md"
Repository = "https://github.com/TahrimWalid/kratos"
Issues = "https://github.com/TahrimWalid/kratos/issues"

[project.optional-dependencies]
# pysigma: tests/test_sigma_fields.py loads real SigmaHQ rules (tested on 2.0). pysigma 2
# needs Python 3.11+; on 3.10 that test skips.
test = ["pytest", "pysigma>=2.0,<3; python_version >= '3.11'"]
# Contributor tooling: lint, build and check the package (scripts/ci).
dev = ["ruff>=0.15,<1", "build>=1.2", "twine>=5"]
# otel: send a copy of each run record (timings, token counts -- never tool results or
# prompts) to your own OpenTelemetry collector (`trace.otel_export`, OTEL_EXPORTER_OTLP_ENDPOINT).
otel = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
# eval: the regression gate (evals/). It needs nothing beyond the core today -- the
# scenarios, scorer, replay and gate are pure Python over kratos itself. Listed so the
# CI eval-replay-smoke job and `pip install '.[eval]'` are explicit; grows if evals/ ever
# takes a dependency the core doesn't.
eval = []

[project.scripts]
# Bare `kratos` launches the full-screen Textual TUI (the primary interface);
# `kratos <subcommand>` (investigate / run / chat / scan / mcp-serve / llm-serve
# / findings-* / ...) dispatches through cli/app.py as before. The classic
# prompt_toolkit REPL is retired as the default face -- its code stays in the
# tree, but there is no longer a bare-command or script entry that launches it.
kratos = "kratos.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that must ship in the wheel: the starter YARA rules (third-
# party, GPLv2 -- their README carries the source, LICENSE the full text) are
# read by run_yara_scan and bundled into every sub-agent installer; the settings
# template is what `kratos init` writes; the event JSON Schema (generated from
# kratos/events/fields.py) documents what `kratos events --json` prints; the ATT&CK
# table (generated from MITRE's official bundle) labels findings.
[tool.setuptools.package-data]
kratos = ["yara_rules/*.yar", "yara_rules/README.md", "yara_rules/LICENSE", "templates/env.example", "attack/*.json",
          "events/schema/*.json"]

# Lint (B.4): narrow on purpose -- real problems, not style. Syntax errors (E9),
# invalid comparisons and statements (F63, F7), undefined names (F82), unused imports
# (F401). The codebase keeps its own formatting; no formatter is enforced. A print to
# stdout in library code is checked by tests/test_no_stdout_print_in_library.py
# instead of ruff's T201, which can't tell stdout from stderr.
[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "data", "kept_tools", "sandbox_staging", "vulscan", "llm"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# evals/ lives at the repo root (it is not shipped in the wheel); make it importable in tests.
pythonpath = ["."]
markers = [
    "bench: performance benchmarks (scripts/bench/) -- a minute or more. Excluded from a bare `pytest` run; opt in with -m bench.",
    "allow_ssh: the test starts an ssh/scp process on purpose (tests/conftest.py refuses it otherwise).",
    "agent_llm: hits a real LLM backend and the real (not mocked) agent loop -- expensive (roughly 1-2 min/scenario on Gemini, 10-20 min/scenario on local qwen2.5:7b). Excluded from a bare `pytest` run; opt in with -m agent_llm.",
]
addopts = "-m 'not agent_llm and not bench'"

