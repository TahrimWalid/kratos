[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kratos-offline-security-assistant"
version = "0.1.0"
description = "Kratos — Offline AI Security Assistant (thesis prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "uvicorn",
    "fastapi",
    "sse-starlette",
    "pydantic-settings",
    "starlette-context",
    "python-dotenv",
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kratos = "kratos.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "agent_llm: hits a real LLM backend and the real (not mocked) agent loop -- expensive (roughly 1-2 min/scenario on Gemini, 10-20 min/scenario on local qwen2.5:7b). Excluded from a bare `pytest` run; opt in with -m agent_llm.",
]
addopts = "-m 'not agent_llm'"

