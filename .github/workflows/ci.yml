# GENERATED from scripts/ci/jobs.toml by `python scripts/ci/ci.py workflow --write` -- do not edit.
# The same jobs run locally, in containers: scripts/ci/run_local.sh
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *"   # daily: new advisories (deps-audit) and new dependency releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: python:3.12-slim
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: "ignore"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: |
          pip install 'ruff==0.17.1'
      - name: Run
        run: |
          id -u ci >/dev/null 2>&1 || useradd -m ci
          cat > /tmp/ci-run.sh <<'CI_RUN_EOF'
          ruff check src tests scripts evals
          CI_RUN_EOF
          chown -R ci .
          runuser -u ci -- env HOME=/home/ci sh -e /tmp/ci-run.sh
