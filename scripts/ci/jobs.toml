]

# The sub-agent runs on a monitored machine's own python3 -- as old as 3.8, nothing
# installed. Nothing is pip-installed here: the bundle must import and pass its tests
# with the standard library alone.
[[job]]
name = "agent-bundle"
image = "python:3.8-slim"
apt = ["procps"]   # `ps`, as on any real machine (the processes read uses it)
setup = []
run = ["python3 scripts/ci/agent_bundle.py check"]

# The log/persistence/live/package scripts run under whatever awk a machine has. With
# all three installed and KRATOS_TEST_REQUIRE_AWKS set, a missing one is an error, so
# these tests never quietly skip an awk.
[[job]]
name = "awk"
image = "python:3.12-slim"
apt = ["git", "tzdata", "procps", "iproute2", "python3", "mawk", "gawk", "busybox"]
env = { TZ = "UTC", KRATOS_TEST_REQUIRE_AWKS = "mawk,gawk,busybox" }
setup = ["pip install -e '.[test]'"]
run = [
    "python -m pytest -q -p no:cacheprovider -rs tests/test_logsources_logread.py tests/test_logsources_parsers.py tests/test_logsources_reads.py tests/test_persistence.py tests/test_live_response.py tests/test_pkgvuln.py tests/test_collect_sync_reads.py tests/test_read_host_logs.py tests/test_timewin_classic.py > awk.out 2>&1 || { cat awk.out; exit 1; }",
    "cat awk.out",
    "! grep -Ei 'SKIPPED.*awk' awk.out",
]

[[job]]
name = "package-3.10"
image = "python:3.10-slim"
setup = ["pip install 'build>=1.2' 'twine>=5'"]
run = [
    "python -m build -o dist",
    "twine check --strict dist/*",
    "python scripts/ci/package_check.py contents dist/*.whl",
    "python scripts/ci/package_check.py install dist/*.whl",
]

[[job]]
name = "package-3.13"
image = "python:3.13-slim"
setup = ["pip install 'build>=1.2' 'twine>=5'"]
run = [
    "python -m build -o dist",
    "twine check --strict dist/*",
    "python scripts/ci/package_check.py contents dist/*.whl",
    "python scripts/ci/package_check.py install dist/*.whl",
]

# The regression gate's replay mode with a scripted model (no key, no network): proves
# the harness itself works -- recordings load, tools replay, the scorer and the gate
# rule run. Not a quality check; the gate itself runs on a maintainer's machine.
[[job]]
name = "eval-replay-smoke"
image = "python:3.12-slim"
env = { TZ = "UTC" }
setup = ["pip install -e '.[test,eval]'"]
run = ["python -m evals smoke"]
