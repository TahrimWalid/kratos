# The CI job list -- the ONE place a job is defined.
#
#   .github/workflows/ci.yml   is generated from it (python scripts/ci/ci.py workflow --write;
#                              tests/test_ci_jobs.py fails when the two differ)
#   scripts/ci/run_local.sh    runs the same jobs here, each in a fresh container
#
# Each job runs in `image` with the repository as its working directory:
#   apt    Debian packages installed first (every image is Debian-based)
#   env    environment for every step
#   setup  install steps (pip ...), as root
#   run    the checks; the job fails on the first command that fails
#   user   run the checks as this unprivileged user (default "ci"); "" keeps root
#
# CI sends nothing anywhere: no API keys, no model calls, no lab. The unit suite's
# tests/conftest.py refuses any test that starts ssh.

[defaults]
# The suite's real-read tests expect a Linux host's userland: procps (ps), iproute2
# (ss), python3 (/usr/bin/python3, for a stand-in scanner's shebang), gawk (the
# read-script tests default to it) and openssh-client (the onboarding tests look for
# Kratos's own key, created in the run step below). journalctl (systemd) can't run in a
# container, so the handful of tests that need it skip themselves when it is absent.
apt = ["git", "tzdata", "procps", "iproute2", "python3", "gawk", "openssh-client"]
user = "ci"
env = { PIP_DISABLE_PIP_VERSION_CHECK = "1", PIP_ROOT_USER_ACTION = "ignore", PYTHONDONTWRITEBYTECODE = "1" }

[[job]]
name = "lint"
image = "python:3.12-slim"
apt = []
setup = ["pip install 'ruff==0.17.1'"]
run = ["ruff check src tests scripts evals"]

[[job]]
name = "test-3.10"
image = "python:3.10-slim"
env = { TZ = "UTC" }
setup = ["pip install -e '.[test]'"]
run = [
    "mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh && ssh-keygen -t ed25519 -N \"\" -f $HOME/.ssh/id_ed25519 -q",
    "python -m pytest -q -p no:cacheprovider",
]

[[job]]
name = "test-3.11"
image = "python:3.11-slim"
env = { TZ = "UTC" }
setup = ["pip install -e '.[test]'"]
run = [
    "mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh && ssh-keygen -t ed25519 -N \"\" -f $HOME/.ssh/id_ed25519 -q",
    "python -m pytest -q -p no:cacheprovider",
]

